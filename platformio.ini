; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; Auto-detect CP210x in scripts/esp32_boot.py (avoids Bluetooth earbuds).
; Override manually if needed: pio run -t upload --upload-port /dev/cu.SLAB_USBtoUART
upload_speed = 115200
upload_flags =
	--before=no-reset
	--connect-attempts=10
build_flags = -DDEBUG_MODE=0
; extra_scripts = pre:scripts/esp32_boot.py
; Exclude the standalone ECU-simulator app from the main firmware build.
build_src_filter = +<*> -<ecu_sim/>
; Bluedroid Classic + WiFi does not fit the default 1.2 MB app partition.
board_build.partitions = huge_app.csv
lib_deps =
	coryjfowler/mcp_can@^1.5.0
	esp32async/ESPAsyncWebServer@^3.7.10
	esp32async/AsyncTCP@^3.4.5
	mikalhart/TinyGPSPlus@^1.1.0
	links2004/WebSockets@^2.7.1

; ESP32-WROOM-32 DOIT DevKit V1 — same GPIOs as NodeMCU-32S, use the 5V pin
; for MCP2515 VCC. Flash: pio run -e esp32doit-devkit-v1 -t upload
[env:esp32doit-devkit-v1]
extends = env:nodemcu-32s
board = esp32doit-devkit-v1
build_flags = -DDEBUG_MODE=0 -DBOARD_DOIT_DEVKIT_V1

; Bench ECU simulator: flash to a SECOND ESP32 + MCP2515 wired CANH/CANL to the
; main board. Replays a recorded capture so the dashboard runs without a car.
; Build/upload: pio run -e esp32-ecu-sim -t upload
[env:esp32-ecu-sim]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_filter = +<ecu_sim/>
lib_deps =
	coryjfowler/mcp_can@^1.5.0

; Legacy Arduino Uno + MCP2515 CAN shield target
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<ecu_sim/>
lib_deps =
	coryjfowler/mcp_can@^1.5.0
	sandeepmistry/CAN@^0.3.1
